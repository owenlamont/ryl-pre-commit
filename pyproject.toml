[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ryl-pre-commit"
version = "0.0.0"
description = "Pre-commit hook for ryl, the fast YAML linter."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["yaml", "linter", "pre-commit", "rust"]
dependencies = [
    "ryl==0.26.0",
]

[project.scripts]
ryl-legacy-hook = "ryl_legacy_hook:_yaml"
ryl-legacy-markdown-hook = "ryl_legacy_hook:_markdown"

[tool.setuptools]
py-modules = ["ryl_legacy_hook"]

[project.urls]
Homepage = "https://github.com/owenlamont/ryl"
Repository = "https://github.com/owenlamont/ryl-pre-commit"
