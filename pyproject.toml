[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[project]
name = "ryl-pre-commit"
version = "0.0.0"
description = "Pre-commit hook for ryl, the fast YAML linter."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["yaml", "linter", "pre-commit", "rust"]
dependencies = [
    "ryl==0.26.1",
]

[project.scripts]
ryl-legacy-hook = "ryl_legacy_hook.hook:_yaml"
ryl-legacy-markdown-hook = "ryl_legacy_hook.hook:_markdown"

[tool.uv.build-backend]
module-name = "ryl_legacy_hook"
module-root = ""

[project.urls]
Homepage = "https://github.com/owenlamont/ryl"
Repository = "https://github.com/owenlamont/ryl-pre-commit"
